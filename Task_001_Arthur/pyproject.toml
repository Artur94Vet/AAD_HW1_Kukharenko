[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "arthur-warehouse-agent-practice"
version = "1.0.0"
description = "ReAct and Plan-and-Execute system for repair-stock reduction"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb==1.5.9",
  "langchain-core==1.6.2",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.2",
]

[tool.setuptools]
py-modules = ["demo_models", "knowledge", "plan_execute", "react_agent", "run_practice", "schemas", "stock_data", "tools", "trajectory_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
