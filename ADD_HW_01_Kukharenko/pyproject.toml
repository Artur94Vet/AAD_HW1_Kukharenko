[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "arthur-warehouse-react-agent"
version = "1.0.0"
description = "ReAct agent for repair-stock analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langchain-core==1.6.2",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "pydantic==2.13.5",
  "python-dotenv==1.2.2",
]

[tool.setuptools]
py-modules = ["demo_model", "react_agent", "run_demo", "schemas", "stock_data", "tools", "trajectory_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
